name: Build APK BanqueParle

# Se déclenche à chaque push sur main/master ainsi que sur les Pull Requests
# et manuellement via l'onglet "Actions" (workflow_dispatch).
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Necessaire pour creer / remplacer la release "latest".
permissions:
  contents: write

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code du dépôt
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # 2. Installe Java (requis par Gradle / Android)
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Installe Flutter (stable)
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Afficher les versions
        run: flutter --version

      # 4. Génère le dossier android/ manquant (le dépôt ne contient QUE
      #    le code Dart + les overrides Android ; les fichiers volumineux
      #    et binaires générés par Flutter — gradle wrapper, etc. — sont
      #    recréés ici à chaque build, jamais commités).
      - name: Générer la structure Android (flutter create)
        run: |
          flutter create --platforms=android --org com.banqueparle --project-name banqueparle .

      # 5. Applique nos fichiers Android personnalisés (écrase ceux générés par flutter create)
      #    - build.gradle.kts : desugaring, signing, minSdk=21, packaging
      #    - AndroidManifest.xml : permissions vocales, service arrière-plan, biométrie
      #    - MainActivity.kt : implémentation personnalisée
      - name: Appliquer les overrides Android personnalisés
        run: |
          set -e
          # build.gradle.kts (doit être copié AVANT flutter pub get)
          cp android_overrides/app/build.gradle.kts android/app/build.gradle.kts
          echo "--- build.gradle.kts appliqué ---"
          cat android/app/build.gradle.kts

          # AndroidManifest.xml
          cp android_overrides/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # MainActivity.kt
          KOTLIN_DIR="android/app/src/main/kotlin/com/banqueparle/banqueparle"
          mkdir -p "$KOTLIN_DIR"
          cp android_overrides/main/kotlin/MainActivity.kt "$KOTLIN_DIR/MainActivity.kt"
          echo "--- MainActivity.kt appliqué ---"
          cat "$KOTLIN_DIR/MainActivity.kt"

          # widget_test.dart
          cp android_overrides/test/widget_test.dart test/widget_test.dart

      # 6-7. Copie uniquement le keystore (build.gradle.kts est déjà configuré dans le repo,
      #      minSdk=21 et signingConfigs sont déjà présents — pas besoin de patcher)
      - name: Copier le keystore release
        run: |
          set -e
          cp android_overrides/release.keystore android/app/release.keystore
          echo "Keystore copié."

      # 7b. Dossier assets/models léger (Vosk désactivé pour stabilité maximale et APK ultra-léger)
      - name: Préparer le dossier assets/models
        run: |
          set -e
          mkdir -p assets/models
          touch assets/models/.gitkeep
          ls -la assets/models/

      # 8. Récupère les dépendances Dart/Flutter
      - name: flutter pub get
        run: flutter pub get

      # 9. Analyse statique (ne bloque pas le build en cas d'avertissement)
      - name: Analyse du code (flutter analyze)
        run: flutter analyze || true

      # 10. Verifie la presence des secrets de connexion a la base Neon.
      #     Sans eux, l'APK se construit quand meme, mais les virements et
      #     l'activation du compte sont desactives (l'application le dit a
      #     l'utilisateur). Les valeurs ne sont jamais ecrites dans les logs.
      - name: Verifier les secrets Neon
        env:
          NEON_HOST: ${{ secrets.NEON_HOST }}
          NEON_PROVISIONER_USER: ${{ secrets.NEON_PROVISIONER_USER }}
          NEON_PROVISIONER_PASSWORD: ${{ secrets.NEON_PROVISIONER_PASSWORD }}
        run: |
          if [ -z "$NEON_HOST" ] || [ -z "$NEON_PROVISIONER_USER" ] || [ -z "$NEON_PROVISIONER_PASSWORD" ]; then
            echo "::warning::Secrets Neon absents : les virements seront desactives dans cet APK. Voir README, section Base de donnees."
            exit 0
          fi

          USER_LC="$(echo "$NEON_PROVISIONER_USER" | tr '[:upper:]' '[:lower:]')"

          # SECURITE : l'APK est telechargeable publiquement et tout ce qu'il
          # contient peut etre extrait. Il ne doit JAMAIS embarquer un
          # identifiant administrateur de la base.
          case "$USER_LC" in
            *owner*|postgres|neon_superuser|*admin*|*superuser*)
              echo "::error::NEON_PROVISIONER_USER ('$NEON_PROVISIONER_USER') ressemble a un role administrateur. Le build est arrete pour ne pas publier un APK contenant un acces complet a la base. Utilisez le role banqueparle_provisioner (voir README, section 3)."
              exit 1
              ;;
          esac

          # NEON_HOST doit etre un nom d'hote seul, pas une URL.
          case "$NEON_HOST" in
            *://*|*@*|*/*|*:*)
              echo "::error::NEON_HOST doit contenir uniquement le nom d'hote (par exemple ep-nom-123456.us-east-2.aws.neon.tech), sans postgresql://, identifiants, port ni chemin."
              exit 1
              ;;
          esac

          case "$NEON_HOST" in
            *-pooler*)
              echo "::warning::NEON_HOST pointe vers le pooler de connexions (-pooler). Preferez l'hote direct : desactivez 'Mise en commun des connexions' dans la fenetre Connecter de Neon, puis copiez l'hote affiche."
              ;;
          esac
          echo "Secrets Neon presents et plausibles."

      # 11. Construit l'APK en mode release universel pour toutes les architectures.
      #     Les parametres de connexion sont injectes a la compilation (--dart-define)
      - name: Build APK Release Universel
        env:
          NEON_HOST: ${{ secrets.NEON_HOST }}
          NEON_DATABASE: ${{ secrets.NEON_DATABASE }}
          NEON_PROVISIONER_USER: ${{ secrets.NEON_PROVISIONER_USER }}
          NEON_PROVISIONER_PASSWORD: ${{ secrets.NEON_PROVISIONER_PASSWORD }}
          # Numero du centre de relation client (touche 6). Un numero de
          # telephone n'est pas un secret : variable ou secret, au choix.
          ADVISOR_PHONE: ${{ vars.ADVISOR_PHONE || secrets.ADVISOR_PHONE }}
        run: |
          DB_NAME="${NEON_DATABASE:-neondb}"
          if [ -z "$ADVISOR_PHONE" ]; then
            echo "::warning::ADVISOR_PHONE absent : la touche 6 (conseiller) annoncera que le numero n'est pas configure."
          fi
          # Build APK release universel (support ARM 32-bit, ARM 64-bit et x86_64)
          flutter build apk --release --no-shrink \
            --dart-define=NEON_HOST="$NEON_HOST" \
            --dart-define=NEON_DATABASE="$DB_NAME" \
            --dart-define=NEON_PROVISIONER_USER="$NEON_PROVISIONER_USER" \
            --dart-define=NEON_PROVISIONER_PASSWORD="$NEON_PROVISIONER_PASSWORD" \
            --dart-define=ADVISOR_PHONE="$ADVISOR_PHONE"

      # 12. Renomme le fichier en banqueparle.apk (nom constant).
      - name: Renommer l'APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/banqueparle.apk
          ls -l build/app/outputs/flutter-apk/

      # 13. Publie l'APK sous un lien UNIQUE ET PERMANENT. La release
      #     "latest" est supprimee puis recreee a chaque push : il n'existe
      #     donc jamais qu'une seule version, et l'adresse de
      #     telechargement ne change jamais :
      #     https://github.com/<utilisateur>/<depot>/releases/download/latest/banqueparle.apk
      #     (Pas de publication pour les pull requests.)
      - name: Publier la derniere version (lien permanent)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest build/app/outputs/flutter-apk/banqueparle.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BanqueParle - derniere version" \
            --notes "Version generee automatiquement a chaque push. Commit : $GITHUB_SHA" \
            --latest
          LINK="https://github.com/$GITHUB_REPOSITORY/releases/download/latest/banqueparle.apk"
          echo "Lien de telechargement permanent : $LINK"
          {
            echo "### Telechargement"
            echo ""
            echo "$LINK"
          } >> "$GITHUB_STEP_SUMMARY"
