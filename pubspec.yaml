name: banqueparle
description: "BanqueParle - Application bancaire vocale accessible (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Détection vocale / reconnaissance ---
  speech_to_text: ^7.0.0

  # --- Synthèse vocale (message de bienvenue) ---
  flutter_tts: ^4.1.0

  # --- Authentification biométrique (empreinte digitale) ---
  local_auth: ^2.3.0

  # --- Connexion directe a la base de donnees Neon (Postgres) ---
  postgres: ^3.4.5

  # --- Stockage chiffre des identifiants de connexion propres a chaque client ---
  flutter_secure_storage: ^9.2.2

  # --- Service d'arrière-plan permanent (écoute du mot-clé) ---
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.5

  # --- Notifications (réveil / mise au premier plan de l'app) ---
  flutter_local_notifications: ^18.0.1

  # --- Gestion des permissions (micro, notifications, ignorer l'optimisation batterie) ---
  permission_handler: ^12.0.1

  # --- Reconnaissance vocale hors ligne (mot-cle, oui/non, menu) ---
  # Moteur Vosk avec vocabulaire restreint : tolere bien mieux les accents
  # que la reconnaissance generaliste, et fonctionne sans internet.
  # Fork maintenu de vosk_flutter : le paquet d'origine impose
  # permission_handler ^10, incompatible avec les plugins recents.
  vosk_flutter_service: ^0.1.3

  # --- Utilitaires ---
  shared_preferences: ^2.3.3
  crypto: ^3.0.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/models/

# Le fork Vosk declare permission_handler ^13, dont la partie Android exige
# le SDK Android 37. Or le projet est compile contre le SDK 36 (maximum
# recommande par la version actuelle de l'outil de build) : la compilation
# echouait sur "requires compile against version 37 or later". La version 12
# offre les memes fonctions (micro, notifications, telephone, batterie) avec
# une partie Android compatible SDK 36. Le plugin Vosk ne s'en sert que pour
# verifier l'autorisation du micro.
dependency_overrides:
  permission_handler: 12.0.1
